<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Recruteur - Réseau Social FuturPro</title>
  <link rel="shortcut icon" href="./assets/img/favicon.2cc4d4cf.ico">
  <link rel="stylesheet" href="./style.css">
  <style>
    body {
      background: #080c10;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }
    .scout-nav {
      background: #111823;
      border-bottom: 1px solid #1f2c3d;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .nav-container {
      max-width: 1200px;
      margin: auto;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-logo {
      height: 38px;
    }
    .nav-tabs {
      display: flex;
      gap: 10px;
    }
    .nav-btn {
      background: none;
      border: 1px solid transparent;
      color: #94a3b8;
      font-weight: 700;
      font-size: 14px;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn.active, .nav-btn:hover {
      background: #f5b041;
      color: #000;
    }
    .main-container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .panel {
      display: none;
    }
    .panel.active {
      display: block;
    }
    .card {
      background: #111823;
      border: 1px solid #1f2c3d;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 24px;
    }
    /* Grid Joueurs */
    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .player-card {
      background: #0d131c;
      border: 1px solid #1f2c3d;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }
    .player-card:hover {
      transform: translateY(-4px);
      border-color: #f5b041;
    }
    .player-header {
      padding: 16px;
      display: flex;
      gap: 14px;
      align-items: center;
      background: #131b26;
    }
    .player-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #f5b041;
    }
    .badge-poste {
      background: rgba(2, 168, 94, 0.2);
      color: #02a85e;
      border: 1px solid #02a85e;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
    }
    .player-body {
      padding: 16px;
      flex: 1;
    }
    .player-specs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 12px;
      color: #cbd5e1;
      margin: 12px 0;
    }
    .player-actions {
      display: flex;
      gap: 10px;
      padding: 14px 16px;
      background: #090e15;
      border-top: 1px solid #1f2c3d;
    }
    .btn-action {
      flex: 1;
      padding: 9px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      border: none;
      text-align: center;
    }
    .btn-save {
      background: #f5b041;
      color: #000;
    }
    .btn-saved {
      background: #334155;
      color: #94a3b8;
    }
    .btn-chat {
      background: #1e293b;
      color: #fff;
    }
    /* Filter Bar */
    .filter-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .filter-bar select, .filter-bar input {
      background: #111823;
      border: 1px solid #1f2c3d;
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <header class="scout-nav">
    <div class="nav-container">
      <a href="/" style="display: flex; align-items: center; text-decoration: none;">
        <img class="brand-logo" src="./assets/img/logo-futurpro.png" alt="FuturPro">
      </a>
      <div class="nav-tabs">
        <button class="nav-btn active" onclick="showTab('joueurs')">1. Joueurs (Catalogue)</button>
        <button class="nav-btn" onclick="showTab('messages')">2. Messages</button>
        <button class="nav-btn" onclick="showTab('enregistres')">3. Enregistrés (Favoris)</button>
      </div>
      <a href="/joueurs" style="color: #02a85e; text-decoration: none; font-size: 13px; font-weight: 700;">← Espace Joueur</a>
    </div>
  </header>

  <main class="main-container">

    <!-- ONGLET 1 : CATALOGUE DES JOUEURS -->
    <section id="tab-joueurs" class="panel active">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <h2 style="margin: 0; color: #f5b041;">Base de Données des Joueurs</h2>
          <span style="font-size: 13px; color: #94a3b8;" id="players-count">Chargement...</span>
        </div>

        <div class="filter-bar">
          <input type="text" id="search-name" placeholder="Rechercher par nom..." oninput="filterPlayers()">
          <select id="filter-poste" onchange="filterPlayers()">
            <option value="">Tous les postes</option>
            <option value="Attaquant">Attaquants</option>
            <option value="Milieu">Milieux</option>
            <option value="Défenseur">Défenseurs</option>
            <option value="Gardien">Gardiens</option>
          </select>
          <select id="filter-pied" onchange="filterPlayers()">
            <option value="">Tous les pieds</option>
            <option value="Droit">Pied Droit</option>
            <option value="Gauche">Pied Gauche</option>
          </select>
        </div>

        <div class="players-grid" id="grid-all-players"></div>
      </div>
    </section>

    <!-- ONGLET 2 : MESSAGES -->
    <section id="tab-messages" class="panel">
      <div class="card">
        <h2 style="margin-top: 0;">Messagerie Directe Clubs & Joueurs</h2>
        <div id="scout-messages"></div>
      </div>
    </section>

    <!-- ONGLET 3 : JOUEURS ENREGISTRÉS (FAVORIS) -->
    <section id="tab-enregistres" class="panel">
      <div class="card">
        <h2 style="margin-top: 0; color: #f5b041;">⭐ Joueurs Enregistrés dans ma Shortlist</h2>
        <p style="color: #94a3b8; font-size: 13px;">Ces talents ont été sélectionnés pour vos prochaines sessions de recrutement ou détections.</p>
        <div class="players-grid" id="grid-saved-players"></div>
      </div>
    </section>

  </main>

  <script>
    let dbData = { players: [], scouts: [] };
    const currentScoutId = 's_1'; // Connecté en tant que Bakari Koné (ASEC Mimosas)

    function showTab(tab) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      event.target.classList.add('active');
      if (tab === 'enregistres') renderSavedPlayers();
    }

    async function loadData() {
      const res = await fetch('/api/data');
      dbData = await res.json();
      renderPlayers(dbData.players);
      renderMessages();
    }

    function renderPlayers(players) {
      document.getElementById('players-count').innerText = `${players.length} joueurs disponibles`;
      const scout = dbData.scouts.find(s => s.id === currentScoutId) || { savedPlayers: [] };

      document.getElementById('grid-all-players').innerHTML = players.map(p => {
        const isSaved = scout.savedPlayers && scout.savedPlayers.includes(p.id);
        return `
          <div class="player-card">
            <div class="player-header">
              <img class="player-avatar" src="${p.photo}" alt="${p.nom}">
              <div>
                <h3 style="margin: 0; font-size: 16px;">${p.prenom} ${p.nom}</h3>
                <span class="badge-poste">${p.poste}</span>
              </div>
            </div>
            <div class="player-body">
              <div class="player-specs">
                <div>📏 Taille : <strong>${p.taille} cm</strong></div>
                <div>⚖️ Poids : <strong>${p.poids} kg</strong></div>
                <div>👟 Pied : <strong>${p.pied}</strong></div>
                <div>📍 Ville : <strong>${p.ville}</strong></div>
              </div>
              <div style="font-size: 12px; color: #94a3b8; margin-top: 6px;">📞 Contact : <strong>${p.numero}</strong></div>
              ${p.video ? `
                <div style="margin-top: 10px; border-radius: 8px; overflow: hidden; background: #000;">
                  <video controls style="width: 100%; max-height: 140px; display: block;" poster="${p.photo}">
                    <source src="${p.video}" type="video/mp4">
                  </video>
                </div>
              ` : ''}
            </div>
            <div class="player-actions">
              <button class="btn-action ${isSaved ? 'btn-saved' : 'btn-save'}" onclick="toggleSavePlayer('${p.id}')">
                ${isSaved ? '★ Enregistré' : '☆ Enregistrer'}
              </button>
              <button class="btn-action btn-chat" onclick="contactPlayer('${p.prenom} ${p.nom}')">Contacter</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderSavedPlayers() {
      const scout = dbData.scouts.find(s => s.id === currentScoutId) || { savedPlayers: [] };
      const saved = dbData.players.filter(p => scout.savedPlayers && scout.savedPlayers.includes(p.id));
      const container = document.getElementById('grid-saved-players');
      
      if (saved.length === 0) {
        container.innerHTML = '<p style="color: #64748b;">Aucun joueur enregistré pour le moment. Cliquez sur "☆ Enregistrer" dans le catalogue.</p>';
        return;
      }

      container.innerHTML = saved.map(p => `
        <div class="player-card" style="border-color: #f5b041;">
          <div class="player-header">
            <img class="player-avatar" src="${p.photo}">
            <div>
              <h3 style="margin: 0; font-size: 16px;">${p.prenom} ${p.nom}</h3>
              <span class="badge-poste">${p.poste}</span>
            </div>
          </div>
          <div class="player-body">
            <div class="player-specs">
              <div>Taille : <strong>${p.taille} cm</strong></div>
              <div>Pied : <strong>${p.pied}</strong></div>
              <div>Ville : <strong>${p.ville}</strong></div>
              <div>Tel : <strong>${p.numero}</strong></div>
            </div>
          </div>
          <div class="player-actions">
            <button class="btn-action btn-saved" onclick="toggleSavePlayer('${p.id}')">Retirer</button>
            <button class="btn-action btn-save" onclick="contactPlayer('${p.prenom} ${p.nom}')">Convoquer</button>
          </div>
        </div>
      `).join('');
    }

    async function toggleSavePlayer(playerId) {
      const res = await fetch('/api/recruteur/save-player', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ scoutId: currentScoutId, playerId })
      });
      const data = await res.json();
      if (data.success) {
        const scout = dbData.scouts.find(s => s.id === currentScoutId);
        if (scout) scout.savedPlayers = data.savedPlayers;
        renderPlayers(dbData.players);
        renderSavedPlayers();
      }
    }

    function filterPlayers() {
      const q = document.getElementById('search-name').value.toLowerCase();
      const poste = document.getElementById('filter-poste').value;
      const pied = document.getElementById('filter-pied').value;

      const filtered = dbData.players.filter(p => {
        const matchName = (p.nom + ' ' + p.prenom).toLowerCase().includes(q);
        const matchPoste = !poste || p.poste.includes(poste);
        const matchPied = !pied || p.pied === pied;
        return matchName && matchPoste && matchPied;
      });
      renderPlayers(filtered);
    }

    function renderMessages() {
      document.getElementById('scout-messages').innerHTML = dbData.messages.map(m => `
        <div style="background: #090e15; border: 1px solid #1e293b; padding: 14px; border-radius: 10px; margin-bottom: 12px;">
          <div style="font-weight: 700; color: #f5b041;">Conversation avec le joueur (ID: ${m.to})</div>
          <p style="margin: 6px 0; color: #e2e8f0;">${m.texte}</p>
          <span style="font-size: 11px; color: #64748b;">${m.date}</span>
        </div>
      `).join('');
    }

    function contactPlayer(nom) {
      alert('Ouverture de la messagerie avec ' + nom + '. Vous pouvez lui envoyer une convocation directe.');
    }

    loadData();
  </script>
</body>
</html>
